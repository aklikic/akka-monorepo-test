name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
      tag:
        description: 'Release tag (e.g., 1.0.0 or auto for automatic generation)'
        required: true
        default: 'auto'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: 'aklikic/akka-release-repo'
      TARGET_BRANCH: 'main'
      DESCRIPTOR_PATH: '${{ github.event.inputs.environment }}/gcp-us-east1/fintech-demo/'
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
      USE_SAME_DOCKER_REPO: 'true'
      SERVICES: 'payments,backoffice,corebanking'
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AKKA_REPO_TOKEN: ${{ secrets.AKKA_REPO_TOKEN }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tag operations

      - name: Generate release tag
        id: generate-tag
        run: |
          
          get_latest_dev_tag() {
            git tag -l "*-dev" | sort -V | tail -n 1
          }
          
          increment_version() {
            local version="$1"
            if [[ $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              local major=${BASH_REMATCH[1]}
              local minor=${BASH_REMATCH[2]}
              local patch=${BASH_REMATCH[3]}
              echo "${major}.${minor}.$((patch + 1))"
            else
              echo "1.0.0"
            fi
          }
          
          extract_version() {
            local tag="$1"
            local env="$2"
            echo "$tag" | sed "s/-${env}$//"
          }
          
          git fetch --tags
          
          if [ "$INPUT_TAG" = "auto" ]; then
            if [ "$ENVIRONMENT" = "dev" ]; then
              # Dev: increment from latest dev tag
              LATEST_TAG=$(git tag -l "*-dev" | sort -V | tail -n 1)
              if [ -z "$LATEST_TAG" ]; then
                NEW_VERSION="1.0.0"
              else
                CURRENT_VERSION=$(extract_version "$LATEST_TAG" "dev")
                NEW_VERSION=$(increment_version "$CURRENT_VERSION")
              fi
            else
              # Non-dev: use latest dev tag version
              LATEST_DEV_TAG=$(get_latest_dev_tag)
              [ -z "$LATEST_DEV_TAG" ] && { echo "Error: No dev tag found"; exit 1; }
              NEW_VERSION=$(extract_version "$LATEST_DEV_TAG" "dev")
            fi
            NEW_TAG="${NEW_VERSION}"
          else
            # Manual tag: use input with environment suffix
            NEW_TAG="${INPUT_TAG}"
          fi
          
          TAG="$NEW_TAG-$ENVIRONMENT"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "DOCKER_TAG=$TAG" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Crane
        uses: imjasonh/setup-crane@v0.1

      - name: Docker login (Docker Hub)
        if: ${{ env.DOCKERHUB_USERNAME && env.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish or Promote Docker image
        env:
          MAVEN_OPTS: -Xmx1024m
        run: |
          if [ "$ENVIRONMENT" = "dev" ]; then
            echo "Dev environment: Building and publishing Docker images"
            mvn package jib:build -DskipTests -Ddocker.tag=${DOCKER_TAG}
          else

            echo "Non-dev environment: Retagging existing remote Docker images"
          
            services=($(echo "$SERVICES" | tr ',' '\n'))

            for service in ${services[@]}; do

              SOURCE_IMAGE="samirachoscalac/akka-demo:${service}-${NEW_TAG}-dev"
              TARGET_IMAGE="samirachoscalac/akka-demo:${service}-${NEW_TAG}-${ENVIRONMENT}" 
              
              #docker manifest create "$TARGET_IMAGE" "$SOURCE_IMAGE" 
              #docker manifest push "$TARGET_IMAGE"
              crane tag "$SOURCE_IMAGE" "${service}-${NEW_TAG}-${ENVIRONMENT}"

              
              #echo "Source image: $SOURCE_IMAGE"
              #echo "Target image: $TARGET_IMAGE"
              #
              ## Pull the source image
              #echo "Pulling source image..."
              #docker pull "$SOURCE_IMAGE"
              #
              ## Retag the image
              #echo "Retagging image..."
              #docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
              #
              ## Push the new tag
              #echo "Pushing retagged image..."
              #docker push "$TARGET_IMAGE"
              #
              #echo "Successfully retagged $SOURCE_IMAGE as $TARGET_IMAGE"   
            done
          fi

      - name: Configure git for CI
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone target repository
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git target-repo
          cd target-repo
          git checkout $TARGET_BRANCH || git checkout -b $TARGET_BRANCH

      - name: Create branch and update service descriptors
        run: |
          # Set PR branch name using generated tag
          PR_BRANCH_NAME="release-${NEW_TAG}-${{ github.run_id }}"

          cd target-repo
          git checkout -b "$PR_BRANCH_NAME"

          # Collect service.yaml files
          SERVICE_FILES=()
          mapfile -t SERVICE_FILES < <(find "$DESCRIPTOR_PATH" -type f -name 'service.yaml' 2>/dev/null || true)

          for f in "${SERVICE_FILES[@]}"; do
            echo "Updating $f"
            
            if [ "${USE_SAME_DOCKER_REPO}" = "true" ]; then
              echo "Using the same Docker repository for all services."
              yq eval --inplace '.service.image = (.service.image | sub("-[^:]*$"; "-" + env(DOCKER_TAG)))' "$f"
            else
              echo "Using individual Docker repositories for services."
              yq eval --inplace '.service.image = (.service.image | sub(":[^:]*$"; ":" + env(DOCKER_TAG)))' "$f"
            fi

          done

          git add "${SERVICE_FILES[@]}"
          git commit -m "chore: Create release ${NEW_TAG}" || echo "No changes to commit"
          git push --set-upstream origin "$PR_BRANCH_NAME"
          
          # Export PR branch name for next step
          echo "PR_BRANCH_NAME=$PR_BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        run: |
          OWNER=$(echo "$TARGET_REPO" | cut -d/ -f1)
          REPO=$(echo "$TARGET_REPO" | cut -d/ -f2)
          BODY="Release: ${NEW_TAG} for ${ENVIRONMENT}\n\nGenerated tag: ${NEW_TAG}\nEnvironment: ${ENVIRONMENT}\n\nGenerated by workflow ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}."

          RESPONSE=$(curl -s -X POST -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${OWNER}/${REPO}/pulls \
            -d "{\"title\": \"chore: Release ${NEW_TAG} for ${ENVIRONMENT}\", \"head\": \"${PR_BRANCH_NAME}\", \"base\": \"${TARGET_BRANCH}\", \"body\": \"${BODY}\"}")

          echo "$RESPONSE"
          PR_URL=$(echo "$RESPONSE" | grep -o '"html_url": *"[^"]*"' | sed -E 's/"html_url": *"([^"]*)"/\1/')
          if [ -z "$PR_URL" ]; then
            echo "Failed to create PR. Response was:" >&2
            echo "$RESPONSE" >&2
            exit 1
          fi
          echo "Pull request created: $PR_URL"
