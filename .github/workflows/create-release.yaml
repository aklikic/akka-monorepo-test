name: Create Release Pull Request

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker image tag to set in the service descriptors'
        required: true
        default: 'latest'
      # Note: target_repo, descriptor_path, target_branch and pr_branch_name are configured as constants
      # at the job level below. Only docker_tag is provided as an input to the workflow.

jobs:
  create-pr:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: 'aklikic/akka-release-repo'
      TARGET_BRANCH: 'main'
      DESCRIPTOR_PATH: 'dev/gcp-us-east1/fintech-demo/'
      PR_BRANCH_NAME: 'release-${{ github.event.inputs.docker_tag }}-${{ github.run_id }}'
      DOCKER_TAG: ${{ github.event.inputs.docker_tag }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Validate input
        run: |
          echo "Docker tag: ${{ github.event.inputs.docker_tag }}"
          echo "Target repo: $TARGET_REPO"
          echo "Descriptor path: $DESCRIPTOR_PATH"
          echo "Target branch: $TARGET_BRANCH"

      - name: Checkout minimal repo
        uses: actions/checkout@v4

      - name: Configure git for CI
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone target repository
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git target-repo
          cd target-repo
          git checkout $TARGET_BRANCH || git checkout -b $TARGET_BRANCH

      - name: Create branch and update service descriptors
        run: |
          cd target-repo
          git checkout -b "$PR_BRANCH_NAME"

          # Collect service.yaml files
          SERVICE_FILES=()
          mapfile -t SERVICE_FILES < <(find "$DESCRIPTOR_PATH" -type f -name 'service.yaml' 2>/dev/null || true)

          for f in "${SERVICE_FILES[@]}"; do
            echo "Updating $f"
            yq eval --inplace '.service.image = (.service.image | sub(":[^:]*$"; ":" + env(DOCKER_TAG)))' "$f"
          done

          git add "${SERVICE_FILES[@]}"
          git commit -m "chore: Create release ${DOCKER_TAG}" || echo "No changes to commit"
          git push --set-upstream origin "$PR_BRANCH_NAME"

      - name: Create Pull Request
        run: |
          OWNER=$(echo "$TARGET_REPO" | cut -d/ -f1)
          REPO=$(echo "$TARGET_REPO" | cut -d/ -f2)
          BODY="Release: ${DOCKER_TAG}\n\nGenerated by workflow ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}."

          RESPONSE=$(curl -s -X POST -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${OWNER}/${REPO}/pulls \
            -d "{\"title\": \"chore: Release ${DOCKER_TAG}\", \"head\": \"${PR_BRANCH_NAME}\", \"base\": \"${TARGET_BRANCH}\", \"body\": \"${BODY}\"}")

          echo "$RESPONSE"
          PR_URL=$(echo "$RESPONSE" | grep -o '"html_url": *"[^"]*"' | sed -E 's/"html_url": *"([^"]*)"/\1/')
          if [ -z "$PR_URL" ]; then
            echo "Failed to create PR. Response was:" >&2
            echo "$RESPONSE" >&2
            exit 1
          fi
          echo "Pull request created: $PR_URL"
